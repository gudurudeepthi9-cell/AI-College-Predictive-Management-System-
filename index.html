<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI College Predictive Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.25);
            color: white;
            text-align: center;
            padding: 25px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 500px;
            max-width: 90%;
            background: white;
            margin: 50px auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .container h2 {
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .info {
            margin-top: 20px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>AI College Predictive Management System</h1>
        <p>Machine Learning Based Student Risk Prediction</p>
    </div>

    <div class="container">

        <h2>Student Prediction</h2>

        <form action="/predict" method="POST">

            <div class="form-group">
                <label>Attendance Percentage</label>
                <input
                    type="number"
                    name="attendance"
                    min="0"
                    max="100"
                    step="0.1"
                    placeholder="Example: 85"
                    required>
            </div>

            <div class="form-group">
                <label>Internal Marks</label>
                <input
                    type="number"
                    name="internal_marks"
                    min="0"
                    max="100"
                    step="0.1"
                    placeholder="Example: 75"
                    required>
            </div>

            <div class="form-group">
                <label>Assignment Score</label>
                <input
                    type="number"
                    name="assignment_score"
                    min="0"
                    max="100"
                    step="0.1"
                    placeholder="Example: 80"
                    required>
            </div>

            <div class="form-group">
                <label>Previous CGPA</label>
                <input
                    type="number"
                    name="previous_cgpa"
                    min="0"
                    max="10"
                    step="0.1"
                    placeholder="Example: 8.2"
                    required>
            </div>

            <button type="submit">
                Predict Academic Risk
            </button>

        </form>

        <div class="info">
            <p>Powered by Random Forest Machine Learning</p>
        </div>

    </div>

</body>

</html>
